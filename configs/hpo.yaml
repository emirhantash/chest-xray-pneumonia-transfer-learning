# Hyperparameter optimization: Bayesian optimization (GP) vs Random Search.
# Both methods use the same search space, trial budget, and sampler seeds; every trial
# trains with the base config's seed, so the objective depends only on the hyperparameters.

base_config: configs/baseline.yaml   # everything not searched (data, split, model, AMP, ...)

n_trials: 30            # completed trials per study (MATLAB bayesopt default: 30 evaluations)
n_startup_trials: 5     # random trials before the GP model is used (bayesopt default: 4)

# Interim report, Table 4. Objective: validation error (1 - accuracy) of the final model.
search_space:
  lr:           {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  batch_size:   {type: categorical, choices: [8, 16, 32, 64]}
  epochs:       {type: int, low: 5, high: 30}
  weight_decay: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  momentum:     {type: float, low: 0.8, high: 0.99}

output_dir: outputs/hpo   # one folder per study: <output_dir>/<method>_seed<seed>/
